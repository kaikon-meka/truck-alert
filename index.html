<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>トラック用 動体検知＆発進アラート</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* ヘッダー */
    header { background: #1e1e1e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    h1 { font-size: 16px; font-weight: bold; color: #00e676; }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #333; color: #aaa; }
    .status-badge.active { background: #00e676; color: #000; font-weight: bold; }
    
    /* 映像表示エリア */
    .viewport { position: relative; flex: 1; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    
    /* アラートオーバーレイ */
    .alert-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 23, 68, 0.5); display: none; justify-content: center; align-items: center; z-index: 10; pointer-events: none; }
    .alert-msg { font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #000; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 8px; border: 2px solid #ff1744; }

    /* コントロールパネル */
    .controls { background: #1e1e1e; padding: 12px 15px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    
    /* ボタンデザイン */
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; color: #fff; background: #333; cursor: pointer; text-align: center; }
    .btn-primary { background: #00e676; color: #000; }
    .btn-danger { background: #ff1744; color: #fff; }
    .btn:active { opacity: 0.8; }

    /* スライダー */
    .slider-group { flex: 2; display: flex; flex-direction: column; gap: 2px; }
    .slider-label { font-size: 11px; color: #aaa; display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: #00e676; }
  </style>
</head>
<body>

  <header>
    <h1>トラックモニター AI</h1>
    <div id="status" class="status-badge">停止中</div>
  </header>

  <div class="viewport">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="alertOverlay" class="alert-overlay">
      <div id="alertMsg" class="alert-msg">動体を検知！</div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <button id="toggleBtn" class="btn btn-primary">カメラ開始</button>
      <button id="resetAlertBtn" class="btn" style="display:none;">アラート解除</button>
    </div>

    <div class="row">
      <div class="slider-group">
        <div class="slider-label"><span>感度 (閾値)</span><span id="sensVal">30</span></div>
        <input type="range" id="sensitivity" min="5" max="100" value="30">
      </div>
      <div class="slider-group">
        <div class="slider-label"><span>検知エリア割合</span><span id="areaVal">10%</span></div>
        <input type="range" id="areaSize" min="5" max="50" value="10">
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggleBtn');
    const statusBadge = document.getElementById('status');
    const alertOverlay = document.getElementById('alertOverlay');
    const resetAlertBtn = document.getElementById('resetAlertBtn');
    const sensitivityInput = document.getElementById('sensitivity');
    const sensVal = document.getElementById('sensVal');
    const areaSizeInput = document.getElementById('areaSize');
    const areaVal = document.getElementById('areaVal');

    let isRunning = false;
    let animFrameId = null;
    let prevFrameData = null;
    let audioCtx = null;

    // スライダー変更イベント
    sensitivityInput.addEventListener('input', () => sensVal.textContent = sensitivityInput.value);
    areaSizeInput.addEventListener('input', () => areaVal.textContent = areaSizeInput.value + '%');

    // Web Audio API による警告音生成
    function playBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5ノート
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // カメラ切り替え
    toggleBtn.addEventListener('click', async () => {
      if (!isRunning) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }, // 背面カメラを試行
            audio: false
          }).catch(() => {
            return navigator.mediaDevices.getUserMedia({ video: true, audio: false }); // フォールバック
          });

          video.srcObject = stream;
          await video.play();
          
          isRunning = true;
          toggleBtn.textContent = '停止';
          toggleBtn.className = 'btn btn-danger';
          statusBadge.textContent = '監視中';
          statusBadge.classList.add('active');
          
          // キャンバスサイズを映像に合わせる
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 240;

          processFrame();
        } catch (err) {
          alert('カメラの起動に失敗しました: ' + err.message);
        }
      } else {
        stopMonitoring();
      }
    });

    function stopMonitoring() {
      isRunning = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      toggleBtn.textContent = 'カメラ開始';
      toggleBtn.className = 'btn btn-primary';
      statusBadge.textContent = '停止中';
      statusBadge.classList.remove('active');
      alertOverlay.style.display = 'none';
      prevFrameData = null;
    }

    // アラート手動解除
    resetAlertBtn.addEventListener('click', () => {
      alertOverlay.style.display = 'none';
      resetAlertBtn.style.display = 'none';
    });

    // 動体検知処理ループ
    function processFrame() {
      if (!isRunning) return;

      const width = canvas.width;
      const height = canvas.height;

      // 簡易処理のためリサイズ描画（低負荷化）
      ctx.drawImage(video, 0, 0, width, height);
      const currentFrame = ctx.getImageData(0, 0, width, height);
      
      if (prevFrameData) {
        let diffCount = 0;
        const threshold = parseInt(sensitivityInput.value, 10);
        const requiredDiffRatio = parseInt(areaSizeInput.value, 10) / 100;
        const totalPixels = width * height;

        // ピクセル単位で差分を計算 (4バイトごとにRGBA)
        for (let i = 0; i < currentFrame.data.length; i += 16) { // 軽易化のため4ピクセル飛ばし
          const rDiff = Math.abs(currentFrame.data[i] - prevFrameData.data[i]);
          const gDiff = Math.abs(currentFrame.data[i+1] - prevFrameData.data[i+1]);
          const bDiff = Math.abs(currentFrame.data[i+2] - prevFrameData.data[i+2]);
          
          if ((rDiff + gDiff + bDiff) / 3 > threshold) {
            diffCount++;
          }
        }

        const currentDiffRatio = (diffCount * 4) / totalPixels;

        // 差分が指定割合を超えたらアラート発動
        if (currentDiffRatio > requiredDiffRatio) {
          triggerAlert();
        }
      }

      prevFrameData = currentFrame;
      animFrameId = requestAnimationFrame(processFrame);
    }

    function triggerAlert() {
      if (alertOverlay.style.display !== 'flex') {
        alertOverlay.style.display = 'flex';
        resetAlertBtn.style.display = 'block';
        playBeep();
      }
    }
  </script>
</body>
</html>
